[package]
name = "bilinker"
version = "0.1.0"
edition = "2021"

[dependencies]
# El formato vigente y sólo él. Los históricos los linkea `bilink-migrate`, que es
# quien los necesita: cargar todos los parsers en el camino de lectura es lo que
# `concepts/migration.md` descarta.
bilink-format  = { path = "../bilink-format" }
serde_yaml_ng  = "0.10"
tree-sitter = "0.25"
streaming-iterator = "0.1"
tree-sitter-java = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
stratum = { git = "https://github.com/anibalanto/stratum.git", branch = "main" }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tree-sitter-typescript = "0.23.2"
scip = "0.8"
protobuf = "=3.7.2"

[dev-dependencies]
tempfile = "3"

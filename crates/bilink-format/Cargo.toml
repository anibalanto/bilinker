[package]
name    = "bilink-format"
# La versión del crate ES la versión del formato: no se puede cambiar el parseo
# sin releasear, ni releasear sin bumpear. Ver ADR-0006.
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow  = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
schemars    = "1"
stratum = { git = "https://github.com/anibalanto/stratum.git", branch = "main" }

[dev-dependencies]
tempfile = "3"
# Sólo para el guard de versión: el formato no hashea nada en runtime.
sha2     = "0.10"
hex      = "0.4"

[package]
name = "bilinker"
version = "0.1.0"
edition = "2021"

[dependencies]
accreta-migrate = { path = "../accreta-migrate" }
# Todavía el formato 1: el rewiring a v2 es lo que sigue. Los dos coexisten a
# propósito —ADR-0003 § "El problema real es de bootstrap"— y el alias deja que
# `bilinker` diga `bilink_format` sin saber cuál está linkeado.
bilink-format  = { path = "../bilink-format-v1", package = "bilink-format-v1" }
tree-sitter = "0.25"
streaming-iterator = "0.1"
tree-sitter-java = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
stratum = { git = "https://github.com/anibalanto/stratum.git", branch = "main" }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tree-sitter-typescript = "0.23.2"
scip = "0.8"
protobuf = "=3.7.2"

[dev-dependencies]
tempfile = "3"

[package]
name = "bilinker-cli"
version = "0.1.0"
edition = "2021"

license.workspace = true
[[bin]]
name = "bilinker"
path = "src/main.rs"

[dependencies]
accreta-migrate = { path = "../accreta-migrate" }
bilinker      = { path = "../bilinker" }
bilink-format = { path = "../bilink-format" }
serde_yaml_ng = "0.10"
bilink-migrate = { path = "../bilink-migrate" }
stratum     = { git = "https://github.com/anibalanto/stratum.git", branch = "main" }
# **El único lugar de bilinker que nombra al daemon.** La librería define el puerto
# `Neighbours` y no sabe quién lo implementa; el binario elige.
lspd-client = { git = "https://github.com/anibalanto/lspd.git", branch = "main" }
clap        = { version = "4", features = ["derive"] }
anyhow      = "1"
chrono      = "0.4"
notify      = "6"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

[dev-dependencies]
bilinker = { path = "../bilinker" }
bilink-format = { path = "../bilink-format" }
serde_yaml_ng = "0.10"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"

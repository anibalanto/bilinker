[package]
name    = "bilink-format"
# La versión del crate ES la versión del formato: no se puede cambiar el parseo
# sin releasear, ni releasear sin bumpear. Ver ADR-0006.
version = "3.1.0"
edition = "2021"

[dependencies]
anyhow      = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml_ng = "0.10"
schemars    = "1"
sha2        = "0.10"
hex         = "0.4"
stratum     = { git = "https://github.com/anibalanto/stratum.git", branch = "main" }

[dev-dependencies]
tempfile = "3"

[workspace]
members = [
    "crates/accreta-migrate",
    "crates/bilink-format",
    "crates/bilink-format-v1",
    "crates/bilink-migrate",
    "crates/bilinker",
    "crates/bilinker-cli",
    "crates/bilinker-lsp",
]
resolver = "2"

# Una sola fuente de verdad: cada crate la hereda con `license.workspace = true`.
[workspace.package]
license = "MIT OR Apache-2.0"
